<p class="lead">목표는 분석 도구의 사용법을 늘리는 것이 아니라, <strong>논문 속 수식을 이해하고 통계적 검증 모형을 직접 설계하는 것</strong>이다. 생물학적 질문을 변수와 가정으로 옮기고, 그 모형이 무엇을 검증하는지 설명할 수 있도록 공부한다.</p>
<p>PCA의 기본 개념을 처음부터 반복하기보다는 필요한 선형대수와 확률을 확인하며, 수식의 유도와 가정으로 한 단계 더 들어간다. 이 노트는 수학, 통계학, 네트워크 과학, 머신러닝을 계산생물학의 질문에 연결하기 위한 학습 지도다.</p>
<h2 id="goal">첫 번째 목표</h2><p><strong>최소제곱법과 정규분포의 최대우도추정(MLE)을 직접 유도한다.</strong> 각 기호의 뜻을 설명하고, 미분을 통해 해를 구하며, 결과가 성립하는 조건을 확인하는 것이 기준이다.</p>
<div class="equation" aria-label="베타 추정값은 y 마이너스 X베타의 제곱 노름을 최소화하는 베타">β̂ = arg min<sub>β</sub> ‖y − Xβ‖²</div>
<p>이 한 식에 데이터의 행렬 표현, 벡터의 길이, 목적함수, 미분, 추정이라는 개념이 함께 들어간다. 먼저 이 연결을 분명히 한 다음 더 복잡한 모형으로 넘어간다.</p>
<h2 id="order">공부 순서</h2><p>한국어 기초 복습은 <a href="#resources/foundation">데이터 사이언스 스쿨</a>에서 시작하고, MML은 개념을 연결하는 두 번째 단계의 참고서로 사용한다.</p><ol class="chapter-list"><li><a href="#math-linear-algebra">선형대수</a>: 벡터·행렬, 직교성, 투영과 최소제곱.</li><li><a href="#math-calculus">미적분</a>: 편미분, 연쇄법칙, 기울기와 극값.</li><li><a href="#stats-probability">확률론</a>: 확률변수, 분포, 기댓값과 조건부 확률.</li><li><a href="#stats-inference">수리통계</a>: 우도, 추정량, 검정과 불확실성.</li><li><a href="#ml-unsupervised">최적화</a>: 목적함수, 정규화와 제약 조건.</li><li><a href="#network-structure">네트워크의 통계적 모형</a>: 영모형, 그래프 구조와 검증.</li></ol>
<h2 id="fields">분야 사이의 관계</h2><p>계산생물학은 생물학적 현상을 계산·수학·통계 모형으로 연구하는 넓은 분야다. 네트워크 과학은 그래프 이론을 기반으로 하면서 통계학과 컴퓨터과학에 걸쳐 있으므로, 통계학의 하위 폴더 하나로만 묶지 않고 별도 장으로 관리한다.</p><p>면역학 논문은 연구 질문과 실험 설계를 이해하는 축이고, 나머지 장은 그 데이터를 해석하고 검증 모형을 만드는 도구에 해당한다. 두 축을 함께 공부하되 논문에 나온 모든 기법을 한 번에 익히려고 하지는 않는다.</p>
<h2 id="how">이 노트의 사용 방법</h2><ol><li>왼쪽 목차에서 공부할 주제를 선택한다.</li><li>교재를 읽으며 각 페이지의 확인 질문에 답한다.</li><li>페이지 아래에서 상태를 바꾸고, 수식의 가정과 유도 과정을 기록한다.</li><li>정리하지 못한 질문은 다음 공부의 출발점으로 남긴다.</li></ol><div class="notice"><p>현재 내용은 대화에서 정한 학습 목표, 추천 교재와 공개 논문을 바탕으로 정리했다. Chrome 탭 목록은 아직 반영하지 않았다. 추천 공부 순서는 완료 기록이나 고정 일정이 아니다.</p></div>`},
'resources':{title:'교재와 공개 자료',group:'학습 안내',html:`
<p>모형을 만들고 수식을 이해하는 데 필요한 부분을 중심으로 읽는다. 한 권을 처음부터 끝까지 읽는 일정은 정하지 않았으며, 필요한 개념을 찾아보고 유도와 예제로 확인하는 방식으로 사용한다.</p>
<h2 id="foundation">기초 복습: 데이터 사이언스 스쿨</h2><p><a href="https://datascienceschool.net/02%20mathematics/02.01%20%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%99%80%20%ED%96%89%EB%A0%AC.html" target="_blank" rel="noopener noreferrer">데이터 사이언스 스쿨 · 데이터와 행렬</a>에서 한국어 설명과 예제로 필요한 기초를 먼저 복습한다. 기호와 연산을 이해한 뒤, 직접 계산해 보고 다음 개념으로 넘어간다.</p><h2 id="main-book">심화·연결 교재: Mathematics for Machine Learning</h2><p>처음부터 통독하는 입문서가 아니라, 기초 복습 뒤 수학 개념들을 연결할 때 참고하는 교재로 둔다. Marc Peter Deisenroth, A. Aldo Faisal, Cheng Soon Ong의 교재. 선형대수·벡터미적분·확률·최적화를 머신러닝의 수학적 언어로 연결할 때 사용한다.</p><ul><li><a href="https://mml-book.com/" target="_blank" rel="noopener noreferrer">영어판 공식 사이트</a></li><li><a href="https://mml-book.github.io/book/mml-book.pdf" target="_blank" rel="noopener noreferrer">영어판 무료 PDF</a></li><li><a href="https://hongpub.co.kr/shop/item.php?it_id=1641524487" target="_blank" rel="noopener noreferrer">한국어판: 머신러닝 수학 바이블 · 홍릉 (2023)</a> — 유료 출판본. 영어판 무료 PDF와는 구분한다.</li></ul>
<h2 id="linear-algebra">선형대수 보충</h2><p><a href="https://textbooks.math.gatech.edu/ila/" target="_blank" rel="noopener noreferrer">Interactive Linear Algebra</a>는 벡터공간, 선형변환, 직교성, 투영과 최소제곱을 확인하는 HTML 교재다. 이 목록에서는 SVD 학습 교재로 제시한 것이 아니다.</p><p>최소제곱 해를 단순히 공식으로 외우지 않고, 데이터 공간에서의 투영이라는 관점으로 설명하는 데 초점을 둔다.</p>
<h2 id="calculus">미적분 보충</h2><p><a href="https://tutorial.math.lamar.edu/classes/calciii/calciii.aspx" target="_blank" rel="noopener noreferrer">Paul’s Online Math Notes · Calculus III</a>에서 편미분, 연쇄법칙, 기울기, 극값과 라그랑주 승수를 확인한다. 읽은 개념을 목적함수의 미분에 직접 적용해 본다.</p>
<h2 id="paper">읽을 논문</h2><p><a href="https://www.nature.com/articles/s41467-024-46773-z" target="_blank" rel="noopener noreferrer">DELVE: feature selection for preserving biological trajectories in single-cell data</a> (Nature Communications, 2024).</p><p>단일세포 데이터 분석의 방법론 논문이다. 그래프와 비지도 특징 선택이 어떻게 생물학적 궤적 보존이라는 문제에 연결되는지 읽는다. 초기 상태는 <strong>아직 읽지 않음</strong>으로 두었다.</p><p><a href="#delve-2024">DELVE 읽기 노트로 이동 →</a></p>`},
'immunology':{title:'면역학 논문 읽기',group:'면역학',html:`<p>면역학 논문은 생물학적 질문, 실험 설계, 데이터와 결론을 함께 읽는 장으로 관리한다. 아직 확인된 면역학 논문 목록을 가져오지 않았으므로 특정 논문을 임의로 추가하지 않았다.</p><h2 id="reading">읽을 때 남길 내용</h2><ol><li>연구자가 설명하려는 현상은 무엇인가?</li><li>비교군과 실험 단위는 어떻게 정해졌는가?</li><li>각 그림이 뒷받침하는 주장은 무엇인가?</li><li>관찰된 연관성과 인과적 해석은 구분되어 있는가?</li><li>데이터 분석에 쓰인 모형의 가정과 한계는 무엇인가?</li></ol><h2 id="methods">방법론 논문과 연결하기</h2><p>DELVE는 면역학의 개념 논문보다는 계산생물학 방법론에 가깝다. <a href="#delve-2024">논문 읽기 장</a>에서 그래프·특징 선택·통계적 검증을 연결해 공부한다.</p>`},
'math-functions':{title:'1.1 수식을 읽는 수학의 언어',group:'1. 수학과 최적화',html:`<p>수식을 읽을 때는 기호의 이름보다 <strong>각 기호가 어떤 대상인지</strong>를 먼저 확인한다. 숫자 하나인지, 벡터인지, 데이터 전체를 담은 행렬인지 구분하면 계산과 해석을 함께 따라갈 수 있다.</p><h2 id="notation">기호와 차원</h2><p>예를 들어 X가 관측치 n개와 변수 p개를 담은 행렬이라면, X의 크기는 n × p다. β가 p차원 계수 벡터일 때 Xβ는 n차원 예측 벡터가 된다. 식의 양쪽 차원이 맞는지 확인하는 습관을 들인다.</p><div class="equation">X ∈ ℝ<sup>n×p</sup>, &nbsp; β ∈ ℝ<sup>p</sup>, &nbsp; Xβ ∈ ℝ<sup>n</sup></div><h2 id="functions">함수, 지수와 로그</h2><p>함수는 입력과 출력의 관계를 나타낸다. 확률모형에서는 양수인 확률밀도의 곱을 다루는 일이 많고, 로그를 취하면 곱을 합으로 바꿀 수 있다. 이 성질은 로그우도 계산의 출발점이다.</p><div class="equation">log ∏<sub>i=1</sub><sup>n</sup> a<sub>i</sub> = ∑<sub>i=1</sub><sup>n</sup> log a<sub>i</sub> &nbsp; (a<sub>i</sub> &gt; 0)</div><h2 id="questions">확인 질문</h2><ul><li>식에 등장하는 변수와 모수, 고정된 데이터는 각각 무엇인가?</li><li>합 기호의 인덱스는 관측치인가, 변수인가?</li><li>로그를 취해도 최적점이 유지되는 이유는 무엇인가?</li></ul><h2 id="reading">읽을 자료</h2><p><a href="#resources">Mathematics for Machine Learning의 영어판·한국어판과 보충 자료</a>를 참고한다.</p>`},
'math-calculus':{title:'1.2 미적분과 편미분',group:'1. 수학과 최적화',html:`<p>모형의 모수를 구하는 과정에서는 목적함수가 모수에 따라 어떻게 달라지는지 알아야 한다. 한 변수의 미분을 여러 변수로 확장한 편미분과 기울기부터 익힌다.</p><h2 id="gradient">편미분과 기울기</h2><p>편미분은 나머지 변수를 고정했을 때 한 변수에 따른 변화율이다. 여러 편미분을 모으면 기울기 벡터가 된다. f(β₁, β₂) = β₁² + 3β₂²라면 다음과 같다.</p><div class="equation">∇f(β) = (2β₁, 6β₂)<sup>T</sup></div><h2 id="chain-rule">연쇄법칙과 최적화</h2><p>모형이 여러 함수의 합성으로 이루어져 있을 때는 연쇄법칙을 사용한다. 미분값이 0인 점은 최적점의 후보이지만, 그것만으로 최소점임이 보장되지는 않는다. 곡률과 정의역, 경계 조건도 살펴본다.</p><h2 id="practice">직접 해볼 것</h2><ol><li>하나의 모수를 가진 제곱오차를 미분해 최소점을 구한다.</li><li>여러 모수에 대한 제곱오차를 기울기 벡터로 쓴다.</li><li>제약 조건이 있는 문제에서 라그랑주 승수가 하는 역할을 설명한다.</li></ol><h2 id="reading">읽을 자료</h2><p><a href="https://tutorial.math.lamar.edu/classes/calciii/calciii.aspx" target="_blank" rel="noopener noreferrer">Paul’s Online Math Notes · Calculus III</a>: 편미분, 연쇄법칙, 기울기, 극값, 라그랑주 승수.</p>`},
'math-linear-algebra':{title:'1.3 선형대수와 최소제곱',group:'1. 수학과 최적화',html:`<p>선형대수는 데이터와 모형의 관계를 간결하게 쓰는 언어다. 행렬 연산을 계산하는 데서 멈추지 않고, 선형변환·벡터공간·직교성과 투영을 연결한다.</p><h2 id="least-squares">최소제곱 문제</h2><p>관측 벡터 y를 X의 열벡터들의 선형결합으로 설명하려고 한다. 잔차 y − Xβ의 제곱 길이를 최소화하는 문제를 쓴다.</p><div class="equation">L(β) = (y − Xβ)<sup>T</sup>(y − Xβ)</div><p>β에 대해 미분하고 기울기를 0으로 두면 정규방정식을 얻는다.</p><div class="equation">X<sup>T</sup>Xβ̂ = X<sup>T</sup>y</div><p>X의 열들이 선형독립이면 XᵀX가 가역이고 해가 유일하다. 이 조건이 성립하지 않을 때는 같은 역행렬 공식을 그대로 적용할 수 없다.</p><h2 id="projection">투영으로 해석하기</h2><p>최소제곱의 예측값은 y를 X의 열공간에 직교 투영한 벡터로 볼 수 있다. 잔차가 그 열공간에 수직이라는 조건이 정규방정식과 연결된다.</p><h2 id="questions">확인 질문</h2><ul><li>X, β, y와 잔차의 차원을 설명할 수 있는가?</li><li>정규방정식을 전개와 미분을 통해 얻을 수 있는가?</li><li>선형독립 가정이 왜 필요한가?</li></ul><h2 id="reading">읽을 자료</h2><p><a href="https://textbooks.math.gatech.edu/ila/" target="_blank" rel="noopener noreferrer">Interactive Linear Algebra</a>의 직교성·투영·최소제곱과 <a href="#resources">Mathematics for Machine Learning</a>을 함께 참고한다.</p>`},
'stats-descriptive':{title:'2.1 확률모형과 가정',group:'2. 확률과 통계',html:`<p>통계적 모형을 만들 때는 먼저 데이터가 생성되는 과정을 확률변수로 표현한다. 모형은 현실의 복사본이 아니라, 어떤 질문에 답하기 위해 필요한 구조와 가정을 정리한 표현이다.</p><h2 id="unit">관측 단위와 변수</h2><p>관측 단위가 세포인지, 시료인지, 실험 개체인지 구분한다. 서로 연결된 관측치들을 독립 표본으로 취급하면 불확실성을 잘못 평가할 수 있다. 모형의 표본 단위와 실험 설계가 일치하는지 확인한다.</p><h2 id="assumptions">가정을 쓰는 방법</h2><ul><li>관측되는 변수와 추정할 모수를 구분한다.</li><li>독립성, 동일분포, 오차 구조를 명시한다.</li><li>모형이 설명하지 않는 변동을 따로 적는다.</li><li>가정이 깨졌을 때 결론이 어떻게 달라지는지 확인한다.</li></ul><h2 id="question">확인 질문</h2><p>분석할 데이터가 주어졌을 때, “무엇을 확률적으로 가정했고 무엇을 고정했는가?”를 수식과 말로 각각 설명한다.</p>`},
'stats-probability':{title:'2.2 확률변수와 분포',group:'2. 확률과 통계',html:`<p>확률분포는 가능한 관측값과 그 불확실성을 표현한다. 분포의 이름을 외우기보다 어떤 가정에서 그 분포가 나오는지, 모수가 무엇을 조절하는지 이해한다.</p><h2 id="expectation">기댓값과 분산</h2><p>기댓값은 분포로 가중한 평균이고, 분산은 기댓값 주변의 제곱 편차를 요약한다. 표본에서 계산한 평균·분산과 분포의 모수를 구분한다.</p><div class="equation">Var(X) = E[(X − E[X])²]</div><h2 id="conditional">조건부 확률과 독립성</h2><p>조건부 확률은 다른 정보가 주어졌을 때의 확률이다. 독립성과 무상관은 일반적으로 같은 조건이 아니다. 두 개념을 혼동하지 않고, 사용할 모형에서 각각 어떤 역할을 하는지 확인한다.</p><h2 id="practice">직접 해볼 것</h2><ul><li>베르누이·이항·정규분포의 모수와 관측값의 범위를 적는다.</li><li>조건부 확률과 베이즈 정리를 작은 표로 계산한다.</li><li>표본평균의 기댓값과 분산을 독립성 가정 아래에서 유도한다.</li></ul>`},
'stats-inference':{title:'2.3 추정과 가설검정',group:'2. 확률과 통계',html:`<p>추정은 데이터로 모수를 구하는 문제이고, 검정은 설정한 가설과 데이터가 얼마나 양립하는지 평가하는 절차다. 계산 공식과 함께 그 절차가 의존하는 가정을 기록한다.</p><h2 id="likelihood">우도와 최대우도추정</h2><p>독립·동일분포 표본 Xᵢ가 평균 μ, 분산 σ²인 정규분포에서 나왔다고 가정한다. 관측값 xᵢ를 고정하고 모수의 함수로 로그우도를 쓴다.</p><div class="equation">ℓ(μ, σ²) = −(n/2) log(2πσ²) − ∑(xᵢ − μ)² / (2σ²)</div><p>μ와 σ²에 대해 미분하면 μ의 최대우도추정량은 표본평균, σ²의 최대우도추정량은 표본평균 주변 제곱 편차 합을 n으로 나눈 값이다. 분모 n − 1을 쓰는 불편분산 추정량과 구분한다.</p><h2 id="tests">검정과 불확실성</h2><p>귀무가설, 대립가설, 검정통계량과 기준 분포를 먼저 정한다. p값을 “귀무가설이 참일 확률”로 해석하지 않는다. 순열 검정에서는 귀무가설 아래 관측값의 교환가능성이 적절한지 확인한다.</p><h2 id="practice">직접 해볼 것</h2><ol><li>정규분포의 로그우도를 처음부터 쓴다.</li><li>평균과 분산의 MLE를 유도한다.</li><li>추정량의 편향과 분산, 신뢰구간이 각각 답하는 질문을 구분한다.</li></ol>`},
'stats-regression':{title:'2.4 회귀와 모형 검증',group:'2. 확률과 통계',html:`<p>회귀모형은 변수 사이의 관계를 표현한다. 모형이 데이터를 잘 설명하는지와 특정 계수가 어떤 의미를 갖는지는 같은 질문이 아니다.</p><h2 id="model">선형회귀의 가정</h2><div class="equation">y = Xβ + ε</div><p>오차의 기댓값, 분산과 관측치 간 의존성을 명시한다. 정규 오차를 가정한 최대우도추정과 최소제곱이 어떻게 연결되는지 유도한다.</p><h2 id="validation">검증할 내용</h2><ul><li>잔차가 보여주는 구조와 이상치는 무엇인가?</li><li>변수 선택과 모형 평가에 같은 데이터를 반복 사용하고 있지는 않은가?</li><li>효과 크기와 불확실성을 함께 보고하는가?</li><li>상관관계만으로 인과적 결론을 내리고 있지는 않은가?</li></ul><h2 id="practice">직접 해볼 것</h2><p>정규 오차 가정에서 로그우도의 최대화가 제곱오차의 최소화와 같아지는 과정을 설명한다. 이후 이분산이나 상관된 오차가 있을 때 무엇이 달라지는지 질문으로 남긴다.</p>`},
'network-basics':{title:'3.1 그래프의 기본 언어',group:'3. 네트워크 과학',html:`<p>네트워크를 공부할 때는 먼저 노드와 엣지가 무엇을 의미하는지 명확하게 정한다. 데이터에서 어떤 기준으로 연결을 만들었는지가 이후 분석의 해석에 영향을 준다.</p><h2 id="definition">방향과 가중치</h2><p>노드는 개체를, 엣지는 관계를 표현한다. 관계에 방향이 있는지, 연결 강도를 가중치로 표현할지 결정한다. 경로, 연결성, 차수와 이웃의 개념을 익힌다.</p><h2 id="construction">그래프를 만드는 선택</h2><p>거리나 유사도를 계산한 뒤 k-최근접 이웃 또는 임곗값으로 연결할 수 있다. 이런 선택은 분석의 중립적인 전처리가 아니라 모형 설계의 일부다.</p><h2 id="questions">확인 질문</h2><ul><li>엣지가 관측된 관계인가, 추정된 관계인가?</li><li>그래프의 방향과 가중치는 어떤 해석을 갖는가?</li><li>연결 규칙을 바꾸면 결과가 얼마나 달라지는가?</li></ul>`},
'network-matrices':{title:'3.2 그래프의 행렬 표현',group:'3. 네트워크 과학',html:`<p>그래프를 행렬로 표현하면 선형대수의 도구를 사용할 수 있다. 각 행렬의 정의와 사용한 그래프의 조건을 함께 적는다.</p><h2 id="adjacency">인접행렬과 차수행렬</h2><p>인접행렬 A의 원소는 노드 사이의 연결 또는 가중치를 나타낸다. 무방향 가중 그래프에서 차수행렬 D는 각 노드 가중치 합을 대각 원소로 갖는다.</p><h2 id="laplacian">그래프 라플라시안</h2><div class="equation">L = D − A</div><p>위 식은 비정규화 라플라시안이다. 정규화 방식에 따라 다른 행렬을 사용하므로 논문에서 정의한 형태를 확인한다. 그래프 위의 신호가 이웃 노드 사이에서 얼마나 달라지는지를 행렬식과 연결해 볼 수 있다.</p><h2 id="questions">확인 질문</h2><ul><li>무방향 그래프에서 A와 L이 대칭인 이유는 무엇인가?</li><li>라플라시안을 적용하는 벡터는 어떤 노드별 값을 나타내는가?</li><li>데이터의 스케일이나 연결 규칙이 행렬에 어떤 영향을 주는가?</li></ul>`},
'network-structure':{title:'3.3 네트워크의 통계적 모형',group:'3. 네트워크 과학',html:`<p>그래프에서 보이는 패턴이 의미 있는지 판단하려면 비교 기준이 필요하다. <strong>영모형(null model)</strong>은 어떤 구조를 유지하고 어떤 구조를 무작위화할지 명시하는 출발점이다.</p><h2 id="null">영모형 설계</h2><p>노드 수, 엣지 수, 차수와 같은 조건 중 무엇을 고정할지 정한다. 비교 기준을 바꾸면 같은 관측 그래프의 해석도 달라질 수 있다.</p><h2 id="test">통계적 검증</h2><ol><li>검증할 생물학적 또는 구조적 질문을 적는다.</li><li>질문에 대응하는 통계량을 정의한다.</li><li>귀무가설 아래 데이터를 생성하거나 재배열하는 방식을 정한다.</li><li>관측 통계량을 기준 분포와 비교한다.</li><li>반복 비교, 의존성과 민감도를 확인한다.</li></ol><h2 id="questions">확인 질문</h2><p>“이 패턴은 우연보다 강하다”라는 주장에 대해, 어떤 우연을 기준으로 삼았는지와 그 기준을 선택한 이유를 설명한다.</p>`},
'ml-evaluation':{title:'4.1 데이터 분할과 평가',group:'4. 머신러닝과 딥러닝',html:`<p>모형을 학습하는 데이터와 평가하는 데이터를 구분한다. 목적이 예측인지, 설명인지, 통계적 검증인지에 따라 평가 기준이 달라진다.</p><h2 id="split">분할의 단위</h2><p>서로 관련된 표본이 학습과 평가에 나뉘어 들어가면 정보 누수가 생길 수 있다. 데이터가 어떤 단위로 수집되었는지 고려해 분할한다.</p><h2 id="evaluation">모형 선택과 평가</h2><p>학습 데이터로 모수를 추정하고, 검증 데이터 또는 교차검증으로 선택하며, 독립적인 평가 절차로 최종 성능을 확인한다. 반복적인 선택 과정 자체도 결과에 영향을 준다.</p><h2 id="questions">확인 질문</h2><ul><li>성능 지표가 실제 연구 질문과 맞는가?</li><li>전처리와 특징 선택을 분할 이전에 수행해 정보가 새지는 않았는가?</li><li>평가 결과의 변동성을 함께 확인했는가?</li></ul>`},
'ml-supervised':{title:'4.2 회귀와 분류 모형',group:'4. 머신러닝과 딥러닝',html:`<p>지도학습은 입력과 목표값의 관계를 데이터로 학습한다. 여러 알고리즘을 나열하기 전에 각 모형의 출력, 손실함수, 가정과 평가 기준을 비교한다.</p><h2 id="loss">손실함수</h2><p>제곱오차는 연속값 예측의 한 가지 기준이다. 분류에서는 확률 출력과 로그손실을 연결해 볼 수 있다. 손실의 선택은 어떤 오차를 중요하게 보는지와 관련된다.</p><h2 id="generalization">일반화</h2><p>학습 데이터의 손실을 줄이는 것과 새로운 데이터에서 잘 작동하는 것은 다르다. 모형 복잡도, 정규화와 평가 설계를 함께 살펴본다.</p><h2 id="practice">직접 해볼 것</h2><p>선형회귀와 로지스틱 회귀에 대해 입력, 모수, 출력과 목적함수를 한 줄씩 적는다. 각 항이 무엇을 의미하는지 설명한다.</p>`},
'ml-unsupervised':{title:'4.3 목적함수와 최적화',group:'4. 머신러닝과 딥러닝',html:`<p>모형의 추정은 종종 목적함수의 최소화 또는 최대화로 표현된다. 어떤 항을 최적화하는지, 제약과 정규화가 왜 들어가는지를 이해한다.</p><h2 id="objective">손실과 정규화</h2><div class="equation">J(β) = L(β) + λR(β)</div><p>L은 데이터에 대한 적합도, R은 모수에 부여한 제약이나 선호를 나타내는 정규화 항이다. λ의 선택은 모형 선택 과정의 일부다.</p><h2 id="gradient-descent">경사하강법</h2><div class="equation">β<sub>t+1</sub> = β<sub>t</sub> − η∇J(β<sub>t</sub>)</div><p>기울기의 반대 방향으로 움직이는 갱신식이다. 학습률 η, 함수의 곡률과 초기값에 따라 수렴 양상이 달라질 수 있다. 모든 문제에서 전역 최적해가 보장되는 것은 아니다.</p><h2 id="questions">확인 질문</h2><ul><li>최적점이 존재하고 유일한지 어떤 조건으로 판단하는가?</li><li>해석적으로 풀 수 있는 문제와 수치적으로 푸는 문제를 구분할 수 있는가?</li><li>정규화가 추정 결과의 해석에 어떤 영향을 주는가?</li></ul>`},
'ml-neural':{title:'4.4 신경망과 역전파',group:'4. 머신러닝과 딥러닝',html:`<p>신경망은 여러 함수의 합성으로 볼 수 있다. 각 층의 차원과 연산을 확인한 뒤, 손실함수의 기울기가 어떻게 계산되는지 따라간다.</p><h2 id="layers">층과 활성화 함수</h2><p>선형변환과 비선형 활성화 함수를 연결해 표현력을 만든다. 가중치 행렬, 편향과 출력 벡터의 차원을 적어 보면 식의 구조를 확인하기 쉽다.</p><h2 id="backprop">역전파</h2><p>역전파는 연쇄법칙을 이용해 모수별 기울기를 효율적으로 계산하는 과정이다. 먼저 작은 계산 그래프에서 미분을 손으로 수행하고, 최적화 알고리즘의 모수 갱신과 구분한다.</p><h2 id="practice">직접 해볼 것</h2><ol><li>입력, 은닉층과 출력의 차원을 적는다.</li><li>하나의 가중치에 대한 손실의 편미분을 유도한다.</li><li>역전파 계산과 경사하강법 갱신이 어떻게 다른지 설명한다.</li></ol>`},
'delve-2024':{title:'5.1 DELVE 읽기 노트',group:'5. 논문 읽기',html:`<p><strong>DELVE: feature selection for preserving biological trajectories in single-cell data</strong><br>Nature Communications 15, 2765 (2024). 2024년 3월 29일 공개.</p><p><a href="https://www.nature.com/articles/s41467-024-46773-z" target="_blank" rel="noopener noreferrer">논문 원문 ↗</a></p><div class="notice"><p>초기 상태는 아직 읽지 않음이다. 아래 내용은 읽기 전 질문과 필요한 개념을 정리한 것이며, 독후 요약이나 검증 완료 기록은 아니다.</p></div><h2 id="position">어떤 분야의 논문인가</h2><p>단일세포 데이터에서 생물학적 궤적을 보존하는 특징을 고르는 계산생물학 방법론 논문이다. 네트워크·그래프와 비지도 특징 선택을 연결해 읽는다. 면역학 자체의 개념 논문으로 분류하지 않는다.</p><h2 id="background">먼저 확인할 개념</h2><ul><li>벡터·행렬, 거리와 유사도</li><li>분산·공분산과 순열 검정</li><li>k-최근접 이웃 그래프와 그래프 라플라시안</li><li>비지도 특징 선택과 단일세포 의사시간(pseudotime)</li></ul><h2 id="questions">읽기 전 질문</h2><ol><li>어떤 특징이 생물학적 궤적을 보존한다고 정의하는가?</li><li>세포 간 유사도와 그래프 구성은 어떻게 결정되는가?</li><li>특징 선택 결과를 어떤 기준과 비교 방법으로 평가하는가?</li><li>통계적 절차는 어떤 가정 아래에서 해석되는가?</li></ol><h2 id="write">읽은 뒤 남길 내용</h2><p>연구 질문, 방법의 각 단계, 주요 그림, 평가 지표, 한계와 남은 질문을 내 말로 기록한다. 논문의 주장과 내가 확인한 결과를 구분한다.</p>`}
};

for(const [id,[concepts,keys,question]]of Object.entries(conceptMap)){const rs=refs.filter(r=>keys.some(k=>r.title.includes(k)));articles[id].keywords=concepts.join(' ');articles[id].html='<h2 id="concepts">핵심 개념</h2><p>'+esc(concepts.join(' · '))+'</p><h2 id="question">공부하며 물어볼 질문</h2><p>'+esc(concepts.join(' · ')+'의 정의와 수식 유도')+'</p><h2 id="references">어디에서 찾아볼까</h2>'+resourceList(rs)+'<p class="small">원문 내용 미복제. 아래에 질문·학습 기록 작성.</p>';}
articles.guide={title:'개념별 자료 찾기',group:'자료 안내',html:'<p>공부하거나 LLM에 질문할 때 다시 찾아볼 <strong>참고자료 색인</strong>. 개념별 원문 위치와 학습 질문 정리. 논문 전문·캡처 미보관.</p><h2 id="start">기초 복습부터 시작하기</h2><p>한국어 기초 복습: 데이터 사이언스 스쿨. 심화·개념 연결: MML. 학습 목표: 최소제곱과 정규분포 MLE 유도, 통계적 검증 모형 설계.</p><h2 id="find">질문으로 찾아보기</h2><div class="table-scroll"><table><thead><tr><th>궁금한 개념</th><th>찾아갈 곳</th></tr></thead><tbody><tr><td>행렬과 최소제곱</td><td><a href="#math-linear-algebra">선형대수 자료</a></td></tr><tr><td>조건부확률과 분포</td><td><a href="#stats-probability">확률 기초</a></td></tr><tr><td>우도·추정·검정</td><td><a href="#stats-inference">수리통계 자료</a></td></tr><tr><td>Louvain·Leiden·CRF</td><td><a href="#category-network_graph_probabilistic">그래프와 확률 모형</a></td></tr><tr><td>세포 상태와 trajectory</td><td><a href="#category-scrna_trajectory">단일세포 방법론</a></td></tr><tr><td>호중구 분화와 이질성</td><td><a href="#category-immunology">면역학 논문</a></td></tr><tr><td>R과 도구 연동</td><td><a href="#category-r_tools">R 도구</a></td></tr></tbody></table></div><h2 id="use">이용 방법</h2><p>왼쪽 목차에서 개념·자료 제목 검색. 자료별 원문 링크, 핵심 개념과 질문 확인. 페이지 하단에서 학습 상태·메모 기록.</p><p><a href="#resources">전체 자료 목록</a> · <button class="link-button" id="download-db">참고자료 DB 내려받기 (JSON)</button></p><p class="small">공개 링크와 확인 가능한 서지정보만 수록. 난이도는 편집상 판단. 서지 확인과 학습 완료 상태의 구분.</p>'};
articles.resources={title:'전체 참고자료',group:'자료 안내',html:'<p>원문 위치 확인용 링크 색인. 논문 전문·PDF·캡처 미보관.</p><p><button class="link-button" id="download-db">참고자료 DB 내려받기 (JSON)</button></p>'+resourceList(refs)};
for(const [key,name]of Object.entries(categoryNames)){articles['category-'+key]={title:name,group:'분야별 자료',html:'<h2 id="references">참고자료</h2>'+resourceList(refs.filter(r=>r.category_key===key))};}
articles.immunology={title:'면역학 · 호중구',group:'분야별 자료',html:articles['category-immunology'].html};
const order=['guide','resources',...Object.keys(categoryNames).map(k=>'category-'+k),...Object.keys(conceptMap),...refs.map(r=>r.id)];
const groups=[['자료 안내',['guide','resources']],...Object.entries(categoryNames).map(([k,n])=>[n,['category-'+k,...refs.filter(r=>r.category_key===k).map(r=>r.id)]]),['기초 개념 찾아보기',Object.keys(conceptMap)]];
const KEY='study-atlas-v1',validStatus=['to-study','studying','summarized'];let progress={},current='guide',timer;const $=id=>document.getElementById(id);
function cleanProgress(raw){const out={};if(!raw||typeof raw!=='object'||Array.isArray(raw))return out;for(const item of items){const value=raw[item.id];if(value&&typeof value==='object')out[item.id]={status:validStatus.includes(value.status)?value.status:'to-study',note:typeof value.note==='string'?value.note.slice(0,100000):''};}return out;}
try{progress=cleanProgress(JSON.parse(localStorage.getItem(KEY)||'{}'));}catch{}
function notify(text){$('toast').textContent=text;clearTimeout(timer);timer=setTimeout(()=>$('toast').textContent='',4500);}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(progress));return true;}catch{notify('저장소를 사용할 수 없습니다. 내보내기로 기록을 보관하세요.');return false;}}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function closeMenu(){document.body.classList.remove('drawer-open');$('toggle-menu').setAttribute('aria-expanded','false');}
function renderToc(){const toc=$('toc'),q=$('search').value.trim().toLowerCase();toc.replaceChildren();for(const [name,ids]of groups){const matches=ids.filter(id=>[articles[id].title,articles[id].group,articles[id].keywords||''].join(' ').toLowerCase().includes(q));if(!matches.length)continue;const details=el('details','toc-group');details.open=!!q||ids.includes(current)||name==='자료 안내';details.append(el('summary','',name));const ul=el('ul','toc-list');for(const id of matches){const li=el('li'),a=el('a','toc-link'+(id===current?' active':''),articles[id].title);a.href='#'+id;if(id===current)a.setAttribute('aria-current','page');a.addEventListener('click',closeMenu);li.append(a);ul.append(li);}details.append(ul);toc.append(details);}if(!toc.children.length)toc.append(el('p','search-empty','검색 결과가 없습니다.'));}
function render(){const parts=location.hash.slice(1).split('/');const candidate=parts[0];current=Object.hasOwn(articles,candidate)?candidate:'guide';const page=articles[current];document.title=page.title+' — 계산생물학 자료 노트';$('breadcrumb').textContent=page.group+' / '+page.title;$('article').innerHTML='<h1>'+page.title+'</h1>'+page.html;renderToc();const outline=$('outline');outline.replaceChildren();$('article').querySelectorAll('h2[id]').forEach(h=>{const li=el('li'),a=el('a','',h.textContent);a.href='#'+current+'/'+h.id;li.append(a);outline.append(li);});const item=items.find(i=>i.id===current);$('item-controls').classList.toggle('hidden',!item);$('page-status').value=progress[current]?.status||'to-study';$('page-note').value=progress[current]?.note||'';$('notes-panel').open=false;$('save-message').textContent='';const pagination=$('pagination');pagination.replaceChildren();const index=order.indexOf(current);for(const [offset,label]of [[-1,'이전'],[1,'다음']]){const id=order[index+offset];if(!id)continue;const a=el('a');a.href='#'+id;a.append(el('small','',label),document.createTextNode(articles[id].title));pagination.append(a);}closeMenu();if(parts[1]){requestAnimationFrame(()=>{const heading=Array.from($('article').querySelectorAll('h2[id]')).find(h=>h.id===parts[1]);if(heading)heading.scrollIntoView();});}else window.scrollTo(0,0);}
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();$('article').focus();$('article').scrollIntoView();});
$('toggle-menu').addEventListener('click',()=>{if(matchMedia('(max-width:800px)').matches){document.body.classList.toggle('drawer-open');$('toggle-menu').setAttribute('aria-expanded',String(document.body.classList.contains('drawer-open')));}else{document.body.classList.toggle('body-wide');}});$('close-menu').addEventListener('click',closeMenu);$('backdrop').addEventListener('click',closeMenu);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});$('search').addEventListener('input',renderToc);window.addEventListener('hashchange',render);
$('page-status').addEventListener('change',()=>{if(!items.some(i=>i.id===current))return;progress[current]={status:$('page-status').value,note:progress[current]?.note||''};if(persist())$('save-message').textContent='이 브라우저에 저장했습니다.';});
$('save-note').addEventListener('click',()=>{if(!items.some(i=>i.id===current))return;progress[current]={status:$('page-status').value,note:$('page-note').value};if(persist()){notify('노트를 이 브라우저에 저장했습니다.');$('save-message').textContent='저장 완료';}});
$('export-btn').addEventListener('click',()=>{const backup={app:'study-atlas',version:1,exportedAt:new Date().toISOString(),progress};const url=URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='study-atlas-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('학습 기록을 JSON 파일로 내보냈습니다.');});$('import-btn').addEventListener('click',()=>$('import-file').click());$('import-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('2MB 이하의 백업 파일을 선택하세요.');const data=JSON.parse(await f.text());if(data.app!=='study-atlas'||data.version!==1||!data.progress||typeof data.progress!=='object'||Array.isArray(data.progress))throw Error('학습 기록 백업 형식이 아닙니다.');const incoming=cleanProgress(data.progress);if(!Object.keys(incoming).length)throw Error('가져올 기록이 없습니다.');if(!confirm('백업에 포함된 항목의 현재 상태와 노트를 덮어쓸까요?'))return;progress={...progress,...incoming};const saved=persist();render();if(saved)notify('백업을 가져왔습니다.');}catch(e){notify(e.message||'파일을 읽을 수 없습니다.');}finally{$('import-file').value='';}});render();


document.addEventListener('click',e=>{if(e.target.id!=='download-db')return;const u=URL.createObjectURL(new Blob([JSON.stringify(referenceDB,null,2)],{type:'application/json'}));const a=el('a');a.href=u;a.download='computational-biology-references.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);});
</script></body></html>
