<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="계산생물학을 위한 수학, 통계학, 네트워크와 머신러닝 학습 노트"><meta name="color-scheme" content="light dark"><title>계산생물학 학습 노트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 색·글꼴 토큰 — wikidocs 계열 각진 문서형 */
:root{color-scheme:light dark;--bg:#ffffff;--bg-side:#ffffff;--bg-soft:#f8f9f9;--bg-box:#fcfcfc;--text:#222222;--text-2:#555555;--text-3:#888888;--line:#dddddd;--line-soft:#eeeeee;--line-strong:#cccccc;--accent:#337ab7;--accent-hover:#286090;--accent-soft:#eef4fa;--link:#337ab7;--ok:#3c763d;--ok-soft:#dff0d8;--warn:#8a6d3b;--warn-bar:#f0ad4e;--warn-soft:#fcf8e3;--label:#6c757d;--code-bg:#f5f5f5;--side-w:260px;--font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#1c1e21;--bg-side:#1c1e21;--bg-soft:#25282c;--bg-box:#212428;--text:#e2e3e5;--text-2:#b8bbbf;--text-3:#8c9197;--line:#373b40;--line-soft:#2b2e32;--line-strong:#474c52;--accent:#2f6ea8;--accent-hover:#3a7dba;--accent-soft:#1f2b37;--link:#7fb2e6;--ok:#86c986;--ok-soft:#1f3320;--warn:#e3bd64;--warn-bar:#c99234;--warn-soft:#352c16;--label:#5a6168;--code-bg:#272a2e}}
/* 기본 — 모든 모서리 직각 */
*,*::before,*::after{box-sizing:border-box;border-radius:0!important}
html{scroll-padding-top:64px;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.67;color:var(--text);background:var(--bg);font-synthesis:none;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:12px;top:-70px;background:var(--bg);padding:8px 12px;z-index:100;border:1px solid var(--line-strong)}
.skip:focus{top:8px}
.hidden{display:none!important}
.ico{display:inline-block;width:1em;height:1em;vertical-align:-.12em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:square}
/* 사이드바 목차 */
.sidebar{position:fixed;top:0;bottom:0;left:0;width:var(--side-w);background:var(--bg-side);border-right:1px solid var(--line);overflow-y:auto;z-index:30;overscroll-behavior:contain}
.side-search{display:flex;align-items:center;height:48px;border-bottom:1px solid var(--line);color:var(--text-3)}
.side-search .ico{flex:none;margin-left:15px;font-size:15px}
.side-search input{flex:1;min-width:0;height:100%;padding:0 12px 0 10px;border:0;background:transparent;outline:none;font-size:14.4px;color:var(--text)}
.side-search input::placeholder{color:var(--text-3)}
.side-search:focus-within{box-shadow:inset 0 -2px 0 var(--accent)}
.book-row{display:flex;align-items:flex-start;gap:9px;padding:11px 15px 10px;border-bottom:1px solid var(--line);background:var(--bg-soft);color:var(--text)}
.book-row:hover{text-decoration:none;color:var(--accent)}
.book-row .ico{flex:none;margin-top:4px;font-size:15px}
.book-title{display:block;font-size:14.4px;font-weight:700;line-height:1.5}
.book-subtitle{display:block;font-size:12px;color:var(--text-3);line-height:1.5}
.toc-group{border-bottom:1px solid var(--line-soft)}
.toc-group summary{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 15px;font-size:14.4px;font-weight:700;color:var(--text);cursor:pointer;list-style:none}
.toc-group summary::-webkit-details-marker{display:none}
.toc-group summary:hover{background:var(--bg-soft)}
.toc-group summary::after{content:'';flex:none;width:7px;height:7px;border-right:1.5px solid var(--text-3);border-bottom:1.5px solid var(--text-3);transform:rotate(45deg);margin:-4px 3px 0 0}
.toc-group:not([open]) summary::after{transform:rotate(-45deg);margin-top:0}
.toc-list{list-style:none;margin:0;padding:0 0 6px}
.toc-label{padding:9px 15px 3px 28px;font-size:12px;font-weight:700;color:var(--text-3)}
.toc-link{display:flex;align-items:baseline;gap:8px;padding:9px 15px 9px 28px;color:var(--text-2);font-size:14.4px;line-height:1.5}
.toc-link:hover{background:var(--bg-soft);color:var(--text);text-decoration:none}
.toc-link.active{background:var(--accent);color:#fff}
.toc-num{flex:none;min-width:22px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--text-3)}
.toc-link.active .toc-num{color:#fff;opacity:.85}
.toc-text{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toc-link[data-status=studying]::after,.toc-link[data-status=summarized]::after{content:'';flex:none;align-self:center;width:7px;height:7px;background:var(--warn-bar)}
.toc-link[data-status=summarized]::after{background:var(--ok)}
.toc-link.active::after{outline:1px solid #fff}
.search-empty{margin:0;padding:12px 15px;font-size:13px;color:var(--text-3)}
.sidebar-foot{padding:14px 15px 20px;font-size:11.5px;line-height:1.8;color:var(--text-3)}
.sidebar-close{display:none}
.backdrop{display:none}
/* 상단바 */
.shell{margin-left:var(--side-w)}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:16px;height:48px;padding:0 24px;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.menu-btn{flex:none;display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);background:var(--bg);font-size:14px;line-height:1;color:var(--text-2)}
.menu-btn:hover{background:var(--bg-soft)}
.crumb{min-width:0;font-size:13.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb .ico{margin-right:5px;color:var(--text)}
.crumb a{color:var(--text);font-weight:700}
.crumb .sep{margin:0 8px;color:var(--text-3)}
.top-tools{display:flex;gap:16px;align-items:center;flex-shrink:0;font-size:13px}
.top-tools a{color:var(--text-2)}
.top-tools a:hover{color:var(--link)}
/* 본문 */
.content-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;max-width:1260px;margin:0 auto;align-items:start}
.article-wrap{width:100%;max-width:860px;min-width:0;margin:0 auto;padding:26px 40px 56px}
article{font-size:16px;line-height:1.67}
article:focus{outline:none}
.page-head{margin:0 0 24px}
article h1{margin:0;padding:10px 0;border-bottom:1px solid var(--text);font-size:24px;line-height:1.33;font-weight:700;letter-spacing:-.01em;word-break:keep-all}
.page-meta{margin:10px 0 0!important;font-size:13.5px;color:var(--text-3)}
.deck{margin:2px 0 0!important;font-size:16px;line-height:1.65;color:var(--text-2);word-break:keep-all}
article h2{margin:44px 0 16px;font-size:22px;line-height:1.4;font-weight:700;letter-spacing:-.01em;scroll-margin-top:64px}
article h3{margin:0 0 8px;font-size:16px;line-height:1.5;font-weight:700}
article p{margin:0 0 16px;word-break:keep-all;overflow-wrap:anywhere}
article ul,article ol{margin:12px 0 20px;padding-left:24px}
article li{margin:5px 0;word-break:keep-all;overflow-wrap:anywhere}
article strong{font-weight:700}
article code{font-family:var(--mono);background:var(--code-bg);color:#c7254e;padding:2px 4px;font-size:.85em}
.small{font-size:13.5px;color:var(--text-3)}
.downloads{margin-top:24px;font-size:14px;color:var(--text-3)}
.link-button{background:none;border:0;color:var(--link);padding:0;font:inherit;cursor:pointer}
.link-button:hover{text-decoration:underline;text-underline-offset:3px}
/* 요약 상자 (fieldset) */
.summary{min-width:0;margin:22px 0 28px;padding:6px 20px 14px;border:2px solid var(--line);background:var(--bg-box)}
.summary legend{padding:0 5px;font-size:14px;font-weight:700;color:var(--text-3)}
.summary dl{display:grid;grid-template-columns:80px minmax(0,1fr);gap:6px 16px;margin:4px 0 0}
.summary dt{font-size:14px;font-weight:700;color:var(--text-2);line-height:1.7}
.summary dd{margin:0;font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
article .summary .plain{list-style:none;margin:0;padding:0}
article .summary .plain li{margin:0}
/* 단원 위치 표시 */
.stepper{margin:0 0 4px}
.stepper ol{display:flex;flex-wrap:wrap;list-style:none;margin:0;padding:0 1px 1px 0}
.stepper li{margin:0}
.step{display:block;min-width:42px;margin:0 -1px -1px 0;padding:4px 8px;border:1px solid var(--line-strong);background:var(--bg);font-size:13px;font-variant-numeric:tabular-nums;text-align:center;color:var(--link)}
.step:hover{background:var(--bg-soft);text-decoration:none}
.step[data-status=studying]{background:var(--warn-soft);color:var(--warn)}
.step[data-status=summarized]{background:var(--ok-soft);color:var(--ok)}
.step.is-current{position:relative;z-index:1;background:var(--accent);border-color:var(--accent);color:#fff}
/* 개념 태그 */
article .chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:4px 0 20px;padding:0}
article .chips li{margin:0;padding:2px 10px;border:1px solid var(--line-strong);background:var(--bg);font-size:14px;line-height:1.6;color:var(--text-2)}
/* 인용형 안내 */
.callout{margin:20px 0;padding:2px 0 2px 20px;border-left:5px solid var(--line);font-size:15px;line-height:1.7;color:var(--text-2)}
.callout.warn{border-left-color:var(--warn-bar)}
.callout-title{margin:0 0 4px!important;font-size:14px;font-weight:700;color:var(--text)}
.callout p{margin:0 0 6px}
.callout p:last-child{margin:0}
/* 자료 목록 */
article .resource-list{list-style:none;margin:6px 0 20px;padding:0;border-top:1px solid var(--line)}
article .resource-list li{margin:0;padding:13px 2px;border-bottom:1px solid var(--line)}
.res-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.res-title{flex:1 1 260px;min-width:0;font-weight:700;line-height:1.55}
.ext{flex:none;margin-left:auto;padding:0 6px;border:1px solid var(--line-strong);font-size:12px;line-height:1.8;color:var(--text-2);white-space:nowrap}
.ext:hover{border-color:var(--accent);color:var(--link);text-decoration:none}
.resource-list p{margin:4px 0 0;font-size:14.5px;line-height:1.65;color:var(--text-2)}
.resource-list .res-meta{font-size:13px;color:var(--text-3)}
.resource-list .res-concepts{font-size:13.5px;color:var(--text-3)}
.resource-list .res-q::before{content:'Q.';margin-right:6px;font-weight:700;color:var(--text-3)}
.role{flex:none;padding:1px 6px;font-size:12px;font-weight:700;line-height:1.7;white-space:nowrap;border:1px solid var(--line-strong);background:var(--bg-soft);color:var(--text-2)}
.role-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.role-base{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--link)}
.role-apply{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.role-option{background:none;border-style:dashed;color:var(--text-3)}
/* 커리큘럼 구성도 */
.cmap{margin:10px 0 8px}
.lane{position:relative;border:1px solid var(--line);background:var(--bg)}
.lane+.lane{margin-top:30px}
.lane+.lane::before{content:'';position:absolute;left:26px;top:-26px;height:20px;border-left:2px solid var(--line-strong)}
.lane+.lane::after{content:'';position:absolute;left:22px;top:-10px;border:5px solid transparent;border-top-color:var(--line-strong)}
.lane-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 14px;border-bottom:1px solid var(--line);background:var(--bg-soft)}
.lane-key{display:inline-grid;place-items:center;width:24px;height:24px;background:var(--accent);color:#fff;font-size:13px;font-weight:700}
.lane-name{font-size:15px;font-weight:700}
.lane-note{font-size:13px;color:var(--text-3)}
.lane-nodes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px;list-style:none;margin:0!important;padding:14px!important}
.lane-nodes li{position:relative;margin:0}
.lane-nodes li+li::before{content:'';position:absolute;left:-24px;top:50%;width:16px;border-top:2px solid var(--line-strong)}
.lane-nodes li+li::after{content:'';position:absolute;left:-10px;top:calc(50% - 4px);border:5px solid transparent;border-left-color:var(--line-strong)}
.node{display:flex;flex-direction:column;gap:2px;height:100%;padding:10px 12px 9px;border:1px solid var(--line-strong);background:var(--bg);color:var(--text)}
.node:hover{border-color:var(--accent);background:var(--accent-soft);text-decoration:none}
.node-no{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--link)}
.node-title{font-size:14.5px;font-weight:700;line-height:1.45;word-break:keep-all}
.node-keys{font-size:13px;line-height:1.55;color:var(--text-3);word-break:keep-all}
.node-status{display:inline-flex;align-items:center;gap:6px;margin-top:auto;padding-top:6px;font-size:12px;color:var(--text-3)}
.node-status::before{content:'';width:7px;height:7px;background:var(--line-strong)}
.node[data-status=studying]{border-left:4px solid var(--warn-bar)}
.node[data-status=studying] .node-status{color:var(--warn)}
.node[data-status=studying] .node-status::before{background:var(--warn-bar)}
.node[data-status=summarized]{border-left:4px solid var(--ok)}
.node[data-status=summarized] .node-status{color:var(--ok)}
.node[data-status=summarized] .node-status::before{background:var(--ok)}
.cmap.topics .lane+.lane{margin-top:14px}
.cmap.topics .lane+.lane::before,.cmap.topics .lane+.lane::after,.cmap.topics .lane-nodes li+li::before,.cmap.topics .lane-nodes li+li::after{content:none}
.cmap.topics .lane-nodes{gap:12px}
/* 표 */
article .table-scroll{overflow-x:auto;margin:14px 0 24px}
article table{width:100%;border-collapse:collapse;border:1px solid var(--line-strong);font-size:14.5px;line-height:1.6}
article th,article td{padding:8px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top;word-break:keep-all}
article th{background:var(--bg-soft);font-weight:700;white-space:nowrap}
.unit-table td:first-child{min-width:190px}
.unit-table td:nth-child(2){min-width:130px}
.unit-table td:nth-child(3){min-width:64px;font-variant-numeric:tabular-nums}
.num{font-weight:700;font-variant-numeric:tabular-nums;margin-right:4px}
/* 분야 상자·갈래 */
article .cat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;list-style:none;margin:8px 0 16px;padding:0}
article .cat-cards li{margin:0}
.cat-cards a{display:block;height:100%;padding:11px 14px;border:1px solid var(--line-strong);color:var(--text)}
.cat-cards a:hover{border-color:var(--accent);background:var(--accent-soft);text-decoration:none}
.cat-cards strong{display:block;font-size:15px;color:var(--link)}
.cat-cards span{font-size:13px;color:var(--text-3)}
.branch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:8px 0 20px}
.branch{border:1px solid var(--line)}
.branch h3{margin:0;padding:7px 14px;border-bottom:1px solid var(--line);background:var(--bg-soft);font-size:15px}
.branch dl{margin:0;padding:4px 14px 12px}
.branch dt{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--text-3)}
.branch dd{margin:0;font-size:14px;line-height:1.65;word-break:keep-all}
article .checklist{list-style:none;padding-left:0}
article .checklist li{position:relative;padding-left:24px}
article .checklist li::before{content:'';position:absolute;left:4px;top:.62em;width:8px;height:8px;background:var(--accent)}
article .unit-links{list-style:none;padding:0}
article .unit-links li{margin:0 0 10px}
.unit-links p{margin:2px 0 0;font-size:14.5px;color:var(--text-2)}
/* 학습 기록 (fieldset) */
.study-footer{min-width:0;margin:52px 0 0;padding:8px 20px 16px;border:2px solid var(--line);background:var(--bg-box);font-size:14px;color:var(--text-2)}
.study-footer legend{padding:0 5px;font-size:14px;font-weight:700;color:var(--text-3)}
.footer-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:6px 0 10px}
.study-footer label{font-size:13.5px;font-weight:700;color:var(--text)}
.study-footer select{-webkit-appearance:none;appearance:none;padding:5px 30px 5px 10px;border:1px solid var(--line-strong);background:var(--bg) linear-gradient(45deg,transparent 50%,var(--text-2) 50%) no-repeat calc(100% - 15px) 52%/5px 5px,var(--bg) linear-gradient(-45deg,transparent 50%,var(--text-2) 50%) no-repeat calc(100% - 10px) 52%/5px 5px;font-size:14px;color:var(--text)}
#save-message{font-size:13px;color:var(--ok)}
.notes-panel summary{padding:4px 0;font-size:14px;font-weight:700;color:var(--link);cursor:pointer}
.notes-panel textarea{display:block;width:100%;min-height:200px;margin:10px 0;padding:12px 14px;border:1px solid var(--line-strong);background:var(--bg);font-size:14.5px;line-height:1.8;color:var(--text);resize:vertical}
.minor-button{padding:5px 12px;border:1px solid var(--line-strong);background:var(--bg);font-size:13px;color:var(--text-2)}
.minor-button:hover{background:var(--bg-soft);color:var(--text)}
.save-button{background:var(--accent);border-color:var(--accent);color:#fff}
.save-button:hover{background:var(--accent-hover);color:#fff}
.storage-note{margin:14px 0 10px;font-size:12.5px;line-height:1.75;color:var(--text-3)}
.backup-actions{display:flex;flex-wrap:wrap;gap:8px}
/* 이전·다음 */
.pagination{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.pagination a{display:block;padding:10px 14px;border:1px solid var(--line-strong);font-size:14.5px;font-weight:700;line-height:1.5;color:var(--link)}
.pagination a:hover{border-color:var(--accent);background:var(--accent-soft);text-decoration:none}
.pagination a.next{grid-column:2;text-align:right}
.pagination small{display:block;margin-bottom:2px;font-size:12px;font-weight:400;color:var(--text-3)}
.site-footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:12px;line-height:1.8;color:var(--text-3)}
/* 페이지 목차 */
.page-outline{margin:16px 0 0;padding-left:14px;border-left:1px solid var(--line);font-size:13px;line-height:1.6}
.page-outline h2{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--text)}
.page-outline ul{list-style:none;margin:0;padding:0}
.page-outline li{margin:0}
.page-outline a{display:block;margin-left:-15px;padding:4px 0 4px 13px;border-left:2px solid transparent;color:var(--text-2)}
.page-outline a:hover{color:var(--text);text-decoration:none}
.page-outline a.active{border-left-color:var(--accent);color:var(--link);font-weight:700}
/* 커리큘럼 도식 패널 */
.side-panel{position:sticky;top:64px;align-self:start;margin:26px 16px 0 0;max-height:calc(100vh - 80px);overflow-y:auto;overscroll-behavior:contain}
.side-map{border:1px solid var(--line);background:var(--bg)}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--bg-soft);font-size:13.5px;font-weight:700}
.side-head a{color:var(--text)}
.side-close{display:none;place-items:center;width:32px;height:32px;border:1px solid var(--line);background:var(--bg);font-size:18px;color:var(--text-2)}
#side-map{padding:2px 0 6px}
.smap-phase{display:flex;align-items:center;gap:7px;padding:9px 12px 3px;font-size:12px;font-weight:700;color:var(--text-2)}
.smap-key{display:inline-grid;place-items:center;flex:none;width:18px;height:18px;background:var(--accent);color:#fff;font-size:11.5px}

$('export-btn').addEventListener('click',()=>{const backup={app:'study-atlas',version:1,exportedAt:new Date().toISOString(),progress};const url=URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='study-atlas-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('학습 기록 JSON 내보내기 완료');});$('import-btn').addEventListener('click',()=>$('import-file').click());$('import-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('파일 크기 초과 · 2MB 이하 백업 파일 필요');const data=JSON.parse(await f.text());if(data.app!=='study-atlas'||data.version!==1||!data.progress||typeof data.progress!=='object'||Array.isArray(data.progress))throw Error('학습 기록 백업 형식 불일치');const incoming=cleanProgress(data.progress);if(!Object.keys(incoming).length)throw Error('가져올 기록 없음');if(!confirm('백업 포함 항목의 현재 상태·노트 덮어쓰기 — 진행 여부 확인'))return;progress={...progress,...incoming};const saved=persist();render();if(saved)notify('백업 가져오기 완료');}catch(e){notify(e.message||'파일 읽기 실패');}finally{$('import-file').value='';}});render();

if(new URLSearchParams(location.search).get('preview')==='mobile'){document.body.replaceChildren();const label=document.createElement('p');label.textContent='모바일 화면 검토 · 390 × 844';label.style.cssText='margin:10px 24px;font-size:12px;color:#64717c';const frame=document.createElement('iframe');frame.id='mobile-qa';frame.title='모바일 화면 검토';frame.src=location.pathname+(location.hash||'#guide');frame.style.cssText='display:block;width:390px;height:844px;border:1px solid #ddd;margin:0 24px 24px;background:white';document.body.append(label,frame);}
</script></body></html>
